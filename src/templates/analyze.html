<!DOCTYPE html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Analyze Text</title>
<link rel="stylesheet" href="/static/style.css">
</head><body class="font-{{ font_pref }}">
<nav>
<span class="title">DSCoaching</span>
<a href="/coach">← Dashboard</a>
</nav>
<div class="page">
<div class="section">
<h2>Analyze Text</h2>
<p style="color:var(--muted);font-size:0.85rem;margin-bottom:1.2rem">Paste any text — conversation logs, messages, session notes — and get a psychological analysis. Standalone, not linked to any coachee.</p>
<textarea id="input" placeholder="Paste conversation, messages, journal entries..." style="min-height:220px"></textarea>
<button id="btn" onclick="analyze()">Analyze</button>
<div id="result" style="display:none;margin-top:1.2rem;white-space:pre-wrap;line-height:1.7;font-size:0.92rem;padding:1rem;background:var(--input);border-radius:var(--radius-sm);border:1px solid var(--border)"></div>
</div>
</div>
<script>
async function analyze(){
  const input=document.getElementById('input').value.trim();
  if(!input)return;
  const btn=document.getElementById('btn');
  const res=document.getElementById('result');
  btn.disabled=true;btn.textContent='Analyzing...';
  res.textContent='Processing...';
  res.style.display='block';
  try{
    const r=await fetch('/coach/analyze',{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({text:input})
    });
    const d=await r.json();
    if(r.ok){res.textContent=d.result;}
    else{res.textContent='Error: '+(d.error||'Unknown error');}
  }catch(e){res.textContent='Error: '+e}
  btn.disabled=false;btn.textContent='Analyze';
}
</script>
</body></html>
