<!DOCTYPE html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Analyze Text</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,sans-serif;background:#1a1a2e;color:#e0e0e0;padding:1rem}
a{color:#e94560;text-decoration:none}
.card{background:#16213e;padding:2rem;border-radius:12px;max-width:800px;margin:0 auto}
h2{color:#e94560;margin-bottom:.5rem}
p.sub{color:#888;font-size:.85rem;margin-bottom:1.5rem}
textarea{width:100%;padding:.7rem;border:1px solid #333;border-radius:6px;background:#0f3460;color:#fff;font-size:.9rem;min-height:250px;resize:vertical}
button{margin-top:.8rem;padding:.8rem 1.5rem;background:#e94560;color:#fff;border:none;border-radius:6px;font-size:1rem;cursor:pointer}
button:disabled{opacity:.5;cursor:wait}
.result{margin-top:1.5rem;white-space:pre-wrap;line-height:1.6;font-size:.95rem;padding:1rem;background:#0f3460;border-radius:8px}
</style></head><body>
<p style="margin-bottom:1rem"><a href="/coach">← Dashboard</a></p>
<div class="card">
<h2>🔍 Analyze Text</h2>
<p class="sub">Paste any text — conversation logs, messages, session notes — and get a psychological analysis. Standalone, not linked to any coachee.</p>
<textarea id="input" placeholder="Paste conversation, messages, journal entries..."></textarea>
<button id="btn" onclick="analyze()">Analyze</button>
<div id="result" class="result" style="display:none"></div>
</div>
<script>
const KEY={{ llm_key|tojson }};
async function analyze(){
  const input=document.getElementById('input').value.trim();
  if(!input)return;
  const btn=document.getElementById('btn');
  const res=document.getElementById('result');
  btn.disabled=true;btn.textContent='Analyzing...';
  res.textContent='Calling Mistral...';
  res.style.display='block';
  const prompt=`You are a coaching psychology assistant. Analyze the following text — it could be a conversation, messages, journal entries, or session notes. Provide a psychological profile of the person(s) involved: emotional patterns, communication style, attachment tendencies, areas of strength, areas of concern, and any recommendations for a coach working with them. Max 400 words. Be empathetic but honest.\n\nTEXT:\n${input.slice(0,15000)}`;
  try{
    const r=await fetch('https://api.mistral.ai/v1/chat/completions',{
      method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+KEY},
      body:JSON.stringify({model:'mistral-small-latest',messages:[{role:'user',content:prompt}],max_tokens:1024})
    });
    const d=await r.json();
    const text=d.choices?.[0]?.message?.content;
    if(!text){res.textContent='Error: '+(d.error?.message||JSON.stringify(d));return}
    res.textContent=text;
  }catch(e){res.textContent='Error: '+e}
  btn.disabled=false;btn.textContent='Analyze';
}
</script>
</body></html>
