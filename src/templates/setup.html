<!DOCTYPE html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Initial Setup</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,sans-serif;background:#1a1a2e;color:#e0e0e0;min-height:100vh;display:flex;align-items:center;justify-content:center}
.card{background:#16213e;padding:2rem;border-radius:12px;width:100%;max-width:400px}
h1{color:#e94560;margin-bottom:.5rem;text-align:center}
p{text-align:center;color:#888;margin-bottom:1.5rem;font-size:.9rem}
label{display:block;margin-bottom:.3rem;color:#a0a0b0;font-size:.9rem}
input{width:100%;padding:.7rem;margin-bottom:1rem;border:1px solid #333;border-radius:6px;background:#0f3460;color:#fff;font-size:1rem}
button{width:100%;padding:.8rem;background:#e94560;color:#fff;border:none;border-radius:6px;font-size:1rem;cursor:pointer}
</style></head><body>
<div class="card">
<h1>⚙️ First-Time Setup</h1>
<p>Create the coach account</p>
<form method="post">
<label>Display Name</label><input type="text" name="name" required>
<label>Username</label><input type="text" name="username" required>
<label>Password</label><input type="password" name="password" required>
<button type="submit">Create Coach Account</button>
</form>
</div>
</body></html>
