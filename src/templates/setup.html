<!DOCTYPE html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Initial Setup</title>
<link rel="stylesheet" href="/static/style.css">
<style>
body{display:flex;align-items:center;justify-content:center;min-height:100vh}
</style></head><body class="font-{{ font_pref }}">
<div class="section" style="width:100%;max-width:400px;padding:2rem">
<h1 style="text-align:center;margin-bottom:.5rem">First-Time Setup</h1>
<p class="text-center muted" style="margin-bottom:1.5rem">Create the coach account</p>
<form method="post">
    {{ csrf_field() }}
<label>Display Name</label><input type="text" name="name" required>
<label>Username</label><input type="text" name="username" required>
<label>Password</label><input type="password" name="password" required>
<label>Your Timezone</label>
<select name="timezone" id="tz-select"></select>
<button type="submit" style="width:100%">Create Coach Account</button>
</form>
</div>
<script>
const sel=document.getElementById('tz-select');
Intl.supportedValuesOf('timeZone').forEach(tz=>{const o=document.createElement('option');o.value=tz;o.textContent=tz.replace(/_/g,' ');sel.appendChild(o)});
try{sel.value=Intl.DateTimeFormat().resolvedOptions().timeZone}catch(e){}
</script>
</body></html>
