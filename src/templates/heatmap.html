<!DOCTYPE html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Compliance Heatmap</title>
<link rel="stylesheet" href="/static/style.css">
<style>
.heatmap-grid{display:flex;flex-wrap:wrap;gap:3px;max-width:700px}
.day{width:18px;height:18px;border-radius:3px;position:relative}
.day:hover::after{content:attr(title);position:absolute;bottom:22px;left:0;background:#000;color:#fff;padding:2px 6px;border-radius:4px;font-size:.75rem;white-space:nowrap;z-index:1}
.legend{display:flex;gap:1rem;margin:1rem 0;font-size:.85rem;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:.3rem}
.legend .box{width:14px;height:14px;border-radius:2px;display:inline-block}
</style></head><body class="font-{{ font_pref }}">
<nav><span class="title">DSCoaching</span><a href="/coach/coachee/{{ cid }}">&larr; Back</a></nav>
<div class="page">
<h2>Compliance Heatmap — {{ coachee.name }}</h2>
<p class="muted" style="margin-bottom:1rem">Last 90 days</p>
<div class="legend">
<span><span class="box" style="background:var(--ok)"></span> All done</span>
<span><span class="box" style="background:var(--warn)"></span> Partial</span>
<span><span class="box" style="background:var(--accent)"></span> Missed</span>
<span><span class="box" style="background:var(--card)"></span> No tasks</span>
</div>
<div class="heatmap-grid" id="heatmap"></div>
</div>
<script>
const days={{ days|safe }};
const grid=document.getElementById('heatmap');
const now=new Date();
for(let i=89;i>=0;i--){
  const d=new Date(now);d.setDate(d.getDate()-i);
  const key=d.toISOString().slice(0,10);
  const el=document.createElement('div');
  el.className='day';
  const info=days[key];
  if(!info){el.style.background='var(--card)'}
  else if(info.completed===info.total){el.style.background='var(--ok)'}
  else if(info.missed>0){el.style.background='var(--accent)'}
  else{el.style.background='var(--warn)'}
  el.title=key+(info?` — ${info.completed}/${info.total} done`:'');
  grid.appendChild(el);
}
</script>
</body></html>
