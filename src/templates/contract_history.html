<!DOCTYPE html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Contract History</title>
<link rel="stylesheet" href="/static/style.css">
</head><body class="font-{{ font_pref }}">
<nav><span class="title">DSCoaching</span><a href="/coach/coachee/{{ coachee.id if coachee else '' }}">&larr; Back</a></nav>
<div class="page">
<h2>Contract History — {{ coachee.name if coachee else 'Unknown' }}</h2>
{% for h in history %}
<div class="section">
<div class="time" style="margin-bottom:.5rem">{{ h.created_at }}</div>
<div class="contract">{{ h.contract_text }}</div>
</div>
{% else %}<p class="muted">No previous versions. Contract history is saved when the coach modifies it.</p>{% endfor %}
</div>
</body></html>
