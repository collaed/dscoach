<!DOCTYPE html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Category Breakdown</title>
<link rel="stylesheet" href="/static/style.css">
<style>
.cat-card h3{text-transform:capitalize;margin-bottom:.5rem}
.bar-bg{background:var(--input);border-radius:4px;height:20px;overflow:hidden;margin:.3rem 0}
.bar{height:100%;border-radius:4px;background:var(--ok)}
.stats{display:flex;gap:1rem;font-size:.85rem;color:var(--muted)}
.stats span{display:flex;align-items:center;gap:.3rem}
</style></head><body class="font-{{ font_pref }}">
<nav><span class="title">DSCoaching</span><a href="/coach/coachee/{{ coachee.id if coachee else '' }}">&larr; Back</a></nav>
<div class="page">
<h2>Category Breakdown — {{ coachee.name if coachee else '' }}</h2>
{% for cat in cats %}
<div class="section cat-card" style="max-width:500px">
<h3>{{ cat.category }}</h3>
<div class="bar-bg"><div class="bar" style="width:{{ (cat.completed / cat.total * 100) if cat.total else 0 }}%"></div></div>
<div class="stats">
<span>{{ cat.completed }}/{{ cat.total }} done</span>
<span>{{ cat.missed }} missed</span>
<span>avg {{ cat.avg_grade }}</span>
</div>
</div>
{% else %}<p class="muted">No task data yet.</p>{% endfor %}
</div>
</body></html>
