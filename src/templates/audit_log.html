<!DOCTYPE html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Audit Log</title>
<link rel="stylesheet" href="/static/style.css">
<style>
.ip{font-family:var(--font-mono);font-size:.8rem;color:var(--muted)}
.ua-cell{max-width:200px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--muted);font-size:.75rem}
</style></head><body class="font-{{ font_pref }}">
<nav><span class="title">DSCoaching</span><a href="/coach">&larr; Dashboard</a></nav>
<div class="page">
<h2>Audit Log</h2>
<div class="section">
<table>
<tr><th>Time</th><th>User</th><th>Role</th><th>Action</th><th>IP</th><th>User Agent</th></tr>
{% for l in logs %}
<tr>
<td>{{ l.created_at }}</td>
<td>{{ l.user_id }}</td>
<td>{{ l.role }}</td>
<td>{{ l.action }}</td>
<td class="ip">{{ l.ip }}</td>
<td class="ua-cell">{{ l.user_agent }}</td>
</tr>
{% else %}<tr><td colspan="6" class="muted">No activity logged yet.</td></tr>{% endfor %}
</table>
</div>
</div>
</body></html>
