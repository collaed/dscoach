<!DOCTYPE html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Add Coach</title>
<link rel="stylesheet" href="/static/style.css">
</head><body class="font-{{ font_pref }}">
<nav><span class="title">DSCoaching</span><a href="/admin">&larr; Admin Dashboard</a></nav>
<div class="page">
<div class="section" style="max-width:500px;margin:0 auto">
<h2>Add Coach</h2>
<form method="post">
    {{ csrf_field() }}
<label>Display Name</label><input type="text" name="name" required>
<label>Username</label><input type="text" name="username" required>
<label>Password</label><input type="password" name="password" required>
<label>Confirm Password</label><input type="password" name="password2" required>
<label>Timezone</label>
<select name="timezone" id="tz-select"></select>
<button type="submit" onclick="if(this.form.password.value!==this.form.password2.value){alert('Passwords do not match');return false}">Create Coach</button>
</form>
</div>
</div>
<script>
const sel=document.getElementById('tz-select');
Intl.supportedValuesOf('timeZone').forEach(tz=>{const o=document.createElement('option');o.value=tz;o.textContent=tz.replace(/_/g,' ');sel.appendChild(o)});
try{sel.value=Intl.DateTimeFormat().resolvedOptions().timeZone}catch(e){}
</script>
</body></html>
