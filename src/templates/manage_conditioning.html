<!DOCTYPE html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mental Conditioning</title>
<link rel="stylesheet" href="/static/style.css">
</head><body class="font-{{ font_pref }}">
<nav><span class="title">DSCoaching</span><a href="/coach">&larr; Dashboard</a></nav>
<div class="page">
<h2>Mental Conditioning</h2>

<div class="section" style="max-width:700px">
<h3>New Prompt</h3>
<form method="post">
    {{ csrf_field() }}
<label>Date</label><input type="date" name="prompt_date" required>
<label>Prompt</label><textarea name="prompt_text" required placeholder="Today I would like you to..."></textarea>
<label>Target</label>
<select name="target" onchange="document.getElementById('ind').style.display=this.value==='individual'?'block':'none'">
<option value="all">All coachees</option>
<option value="individual">Specific coachee</option>
</select>
<div id="ind" style="display:none">
<label>Coachee</label>
<select name="coachee_id">
<option value="">--</option>
{% for cc in coachees %}<option value="{{ cc.id }}">{{ cc.name }}</option>{% endfor %}
</select>
</div>
<button type="submit">Post Prompt</button>
</form>
</div>

<div class="section" style="max-width:700px">
<h3>Past Prompts</h3>
{% for p in prompts %}
<div class="entry">
<strong>{{ p.prompt_date }}</strong>
{% if p.target == 'individual' %}<span class="muted">(for {{ p.coachee_name }})</span>{% else %}<span class="muted">(all)</span>{% endif %}
<div>{{ p.prompt_text }}</div>
</div>
{% else %}<p class="muted">No prompts yet.</p>{% endfor %}
</div>
</div>
</body></html>
