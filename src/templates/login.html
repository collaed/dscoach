<!DOCTYPE html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Coaching System - Login</title>
<link rel="stylesheet" href="/static/style.css">
<style>body{min-height:100vh;display:flex;align-items:center;justify-content:center}
.login-card{background:var(--card);padding:2rem;border-radius:12px;width:100%;max-width:400px;box-shadow:0 4px 24px rgba(0,0,0,.4)}
.login-card h1{text-align:center;margin-bottom:1.5rem}
.error{color:var(--danger);text-align:center;margin-bottom:1rem}
</style></head><body>
<div class="login-card">
<h1>🔐 Coaching System</h1>
{% if error %}<p class="error">{{ error }}</p>{% endif %}
<form method="post">
<label>Username</label><input type="text" name="username" required>
<label>Password</label><input type="password" name="password" required>
<button style="width:100%">Sign In</button>
</form>
<p class="text-center mt-1 small">
<a href="#" onclick="forgotPw();return false">Forgot password?</a> · <a href="/features">Features →</a>
</p>
</div>
<script>
function forgotPw(){
  const u=document.querySelector('[name=username]').value||'';
  window.location='mailto:papillon.severin@gmail.com?subject=Password%20Reset%20Request&body=Username:%20'+encodeURIComponent(u);
}
</script>
</body></html>
