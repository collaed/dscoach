[project]
name = "dscoaching"
version = "0.23.3"
requires-python = ">=3.12"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "lib"]
addopts = "-v --tb=short"

[tool.ruff]
line-length = 120
target-version = "py312"
exclude = ["lib/", "src/db.py", "src/db_pg.py", "src/server_docker.py"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
ignore = ["E501", "SIM105"]  # E501: line length via formatter; SIM105: try-except-pass is intentional

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]  # assert allowed in tests
"src/app.py" = ["E501"]  # SQL strings are naturally long

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
exclude = ["lib/", "src/db.py", "src/db_pg.py"]

[tool.bandit]
exclude_dirs = ["lib", "tests"]
